name: asra_app_new
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^4.0.5
  country_picker: ^2.0.20
  intl: ^0.18.1
  shared_preferences: ^2.0.15
  fluttertoast: ^8.0.9
  socket_io_client: ^2.0.0
  timelines: ^0.1.0
  font_awesome_flutter: ^10.2.1
  http: ^1.0.0
  curved_navigation_bar: ^1.0.3
  flutter_svg: ^2.0.6
  file_picker: ^5.2.2
  flutter_local_notifications: ^14.1.0
  workmanager: ^0.5.1
  flutter_background_service: ^2.4.5
  flutter_datetime_picker: ^1.5.1
  firebase_messaging: ^14.1.3
  background_location: ^0.8.1
  flutter_expandable_fab: ^1.6.1
  qr_flutter: ^4.0.0
  google_maps_flutter: ^2.2.2
  location: ^4.4.0
  flutter_html: ^3.0.0-beta.1
  collection: ^1.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo-sm.png"

flutter:

  uses-material-design: true
  assets:
    - assets/imgs/
    - assets/markers/
    - assets/
    - assets/svg/cheuffeur.svg
    
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true
